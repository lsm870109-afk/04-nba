;
; OEdit geomdata.cfg
;
;  Preprocessing: remove, truncate
;  Postprocessing: names, name-default
;

[remove]
r1=ALPHA_
r2=alpha_
r3=OPAQUE_
r4=opaque_
r5=TRANS_
r6=trans_
r7=RUBBER_
r8=rubber_
r9=ADDON_
r10=addon_
r11=GEOM_
r12=geom_
r13=ADD_
r14=add_

[truncate]
t1=~

[name-default]
prepend=_
append=

[names]
; trunk
TRNShape=Trunk
TRNKShape=Trunk
TRUNKShape=Trunk

; windows
WINShape=Window (Front)
RWShape=Window (Rear)
BWShape=Window (Back)
DWShape=Window (Left)
PWShape=Window (Right)
DBWShape=Window (B Left)
PBWShape=Window (B Right)

; rear
REARShape=Rear
RBShape=Rear (Body)

; front
FRNShape=Front
FBShape=Front (Body)

; wheels
WRLShape=Wheel (Rear L)
WRRShape=Wheel (Rear R)
WFLShape=Wheel (Front L)
WFRShape=Wheel (Front R)

; brake-set1
BRAKE_RFShape=Brake (Front R)
BRAKE_LRShape=Brake (Rear L)
BRAKE_LFShape=Brake (Front L)
; brake-set2
BRAKE_RLShape=Brake (Rear L)
BRAKE_FLShape=Brake (Front L)
BRAKE_FRShape=Brake (Front R)
; brake-common
BRAKE_RRShape=Brake (Rear R)

; door (2-doors)
PDShape=Door (R)
DDShape=Door (L)
; door (4-doors)
PFDShape=Door (Front R)
DFDShape=Door (Front L)
PRDShape=Door (Rear R)
DRDShape=Door (Rear L)

; side-set1
PFQPShape=Side (R)
DFQPShape=Side (L)
; side-set2
FQPPShape=Side (Front R)
FQPDShape=Side (Front L)
RQPPShape=Side (Rear R)
RQPDShape=Side (Rear L)
; side (other)
PSShape=Side (R)
DSShape=Side (L)

; headlight-covers-set1
LGPShape=HLight Cover (R)
LGDShape=HLight Cover (L)
; headlight-covers-set2
PLGShape=HLight Cover (R)
DLGShape=HLight Cover (L)

; other
TOPShape=Top
INTShape=Interior
HOODShape=Hood
INT_BTMShape=Bottom
STEERINGWHEELShape=Steering Wheel
MISCShape=Misc Parts